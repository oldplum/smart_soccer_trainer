board: esp-SensairShuttle
chip: esp32c5
version: 1.0.0
# Peripherals Configuration
peripherals:
  - name: i2c_master
    type: i2c
    role: master
    config:
      port: 0
      pins:
        sda: 2
        scl: 3

  # PA CONTROL
  - name: gpio_pa_control
    type: gpio
    role: io
    config:
      pin: 1                      # GPIO pin number
      mode: GPIO_MODE_OUTPUT
      default_level: 1
